 idea_NATO_countries: "Государство-участник НАТО"
 idea_NATO_countries_desc: "[ROOT.GetFlag]§C[ROOT.GetName]§! является государством-участником §CОрганизации Североатлантического договора§! \n\n§CОрганизация Североатлантического договора§!, более известная как §CНАТО§! (North Atlantic Treaty Organisation, NATO), представляет собой военно-политический союз стран Северной Америки и Европы, который был создан с целью противодействия советской экспансии в послевоенной Европе. \n\n§CНАТО§! был образован 4 апреля 1949 г. путем подписания в Вашингтоне (США) Североатлантического договора, участниками которого стали 12 государств. Поводом для создания альянса послужила растущая напряженность в послевоенной Европе, в том числе Берлинский кризис 1948–1949 гг., в ходе которого §RСССР§! блокировал доступ в Западный Берлин. Кроме того, к созданию §CНАТО§! подтолкнули опасения западных стран из-за возможности распространения коммунизма. \n\nОсновой военно-политического союза стал принцип коллективной обороны, закрепленный в ст. 5 Договора, согласно которому §Yнападение на одного из членов НАТО приравнивается к атаке на всех.§!"

