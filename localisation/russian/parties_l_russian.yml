 khomeinism:0 "§GХомейнизм§!"
 khomeinism_noun:0 "§GРеволюционный шиизм§!"
 khomeinism_desc:0 "§GХомейнизм§!, как идеологическая основа этой революции представляет собой целостную религиозно-политическую систему философских и социально-политических идей и взглядов. Именно он составил впоследствии стержень внешнеполитической концепции §GИсламской Республики Иран (ИРИ)§!, начал оказывать значительное влияние на становление идеологических и геостратегических элементов нового миропорядка, на характер деятельности исламистских партий и движений современного мира"

 salafi_jihadism:0 "Салафитский джихадизм"
 salafi_jihadism_noun:0 "Салафитский режим"
 salafi_jihadism_desc:0 "§GСалафитский джихадизм§! - это религиозно-политическая суннитская исламистская идеология, которая стремится установить всемирный халифат. Она характеризуется ведением борьбы и войны против немусульман и оправданием насильственного свержения местных мусульманских правительств как «ближнего врага» с целью установления законов шариата."

#Реакционизм
 reactionism:0 "§8Реакционизм§!"
 reactionism_noun:0 "§8Реакционизм§!"
 reactionism_desc:0 "§8Реакционный режим§!"

 market_socialism:0 "Рыночный социализм"
 market_socialism_noun:0 "Социалистический режим"
 market_socialism_desc:0 "Рыночный социализм - форма социализма, экономическая система, или же теория о ней, в которой сочетаются как государственные плановые механизмы, так и государственный капитализм или государственно-монополистический капитализм: конкурентный рынок для функционирования экономики"

 kemalism:0 "Кемализм"
 kemalism_noun:0 "Националистический режим"
 kemalism_desc:0 "Кемализм - это идеология турецкого национализма, выдвинутая Мустафой Кемалем Ататюрком. Доныне считается официальной идеологией Турецкой республики. Однако современные сторонники кемализма считают, что их идеология является эффективной моделью развития стран Третьего мира. Сходной мысли придерживается и американский политолог Сэмюэл Хантингтон, особо выделяя в кемализме момент радикальной (революционной) вестернизации и разрыва с прежними культурными традициями. В основе кемализма лежат 6 пунктов («шесть стрел» — тур. Alti Ok). Первые четыре стрелы были сформулированы в 1927 году, а затем в 1931 к ним были добавлены ещё две. Окончательно доктрина шести стрел была закреплена в конституции 1937 года"

 zionism:0 "§WСионизм§!"
 zionism_noun:0 "§WСионистское движение§!"
 zionism_desc:0 "§WСионизм§! — политическое национальное движение, целью которого является объединение и возрождение еврейского народа на его исторической родине — в §WЗемле Израиля (Эрец-Исраэль)§!, а также идеологическая концепция, на которой это движение основывается. Основателем политического сионизма является общественный и политический деятель Теодор Герцль"

