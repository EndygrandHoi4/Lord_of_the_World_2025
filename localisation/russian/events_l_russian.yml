 canada.1d:0 "Мда..."
 canada.1a:0 "Дайте им чего просят..."
 canada.1b:0 "Не-а"

 canada.2t:0 "США хотят 51 штат!"
 canada.2d:0 "США потребовали от нас вход в их состав."
 canada.2a:0 "Война не стоит жертв..."
 canada.2b:0 "Компромисс с автономией?"
 canada.2c:0 "Расхотят."

