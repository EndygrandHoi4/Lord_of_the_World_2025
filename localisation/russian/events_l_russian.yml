 denmark.1b:0 "Задрать цены! Пусть затянут пояса!"

 #Казахстан
 kazakhstan.1t:0 "Автономия Алаша?"
 kazakhstan.1d:0 "РФ предлагает автономию Казахстана в составе России, стоит отметить: отказ может обернуться войной."
 kazakhstan.1a:0 "Автономия - лучше чем ничего"
 kazakhstan.1b:0 "Не-а!"

 kazakhstan.2t:0 "Экспансия в обмен на автономию?"
 kazakhstan.2d:0 "РФ предлагают войти в их состав как автономия за расширение при их поддержке на юг!"
 kazakhstan.2a:0 "Хм..."
 kazakhstan.2b:0 "Нет"

