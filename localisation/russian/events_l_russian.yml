 usa.4d:0 "Марк Рубио на днях обвинил Илона Маска в пустословии, якобы, оптимизация бюджета Маском - была не столь эффективна. После этого, по всей видимости, случилась драка между двумя."
 usa.4a:0 "Маск - балабол"
