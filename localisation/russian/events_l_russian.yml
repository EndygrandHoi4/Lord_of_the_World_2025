l_russian:
 ukraina.1t:0 "Россия ставит ультиматум мира!"
 ukraina.1d:0 "Россия направила нам меморандум предусматривающий демобилизацию ВСУ, вывод войск с, якобы, их территорий"
 ukraina.1a:0 "Нам плевать на их требования"
 ukraina.1b:0 "Видимо выбора у нас нет..."

 ukraina.2t:0 "Ультиматум!"
 ukraina.2d:0 "Правительство России отправило ультиматум, по которому мы можем получить мир в обмен на большие уступки..."
 ukraina.2a:0 "Если это поможет нам..."
 ukraina.2b:0 "Нет!"

 russia.1t:0 "Украина отказала в мире!"
 russia.1d:0 "Украина ответила отказом на наш меморандум, значить - быть войне до победы!"
 russia.1a:0 "404"

 russia.2t:0 "Украина согласна на мир!"
 russia.2d:0 "Начало выборов"
 russia.2a:0 "Решить вопрос 404"

 russia.3t:0 "Зе сдаётся!"
 russia.3d:0 "На нашь ультиматум нелегитимное правительство Зеленского ответило согласием. Похоже, они испугались за свои шкуры, перед восстанием народа."
 russia.3a:0 "Абсолютная победа!"

 russia.4t:0 "Карпатский вопрос"
 russia.4d:0 "Голодные гиены и вороны слетаются на падаль пограничья."
 russia.4a:0 "Карпаты - Венгрия"
 russia.4b:0 "Карпаты - Словакия"
 russia.4c:0 "Пускай это будет вторым Преднестровьем!"

 russia.5t:0 "Встреча Путин-Трамп-Зеленский"
 russia.5d:0 "На днях была проведена встреча президентов РФ и Украины при посредничестве президента США, Дональда Трампа. На встрече Украина обязалась принять все условия со стороны РФ"
 russia.5a:0 "И, всё таки, карт нет."

 russia.6t:0 "Интервью Путина!"
 russia.6d:0 "Недавно вышло интервью уставшего от работы Путина, объявившего об уходе из политики, новость поразила весь мир, и никто, никто не знает что будет с Россией. Впрочем, может нам удастся его переубедить"
 russia.6a:0 "Заслуженный отдых - великому человеку."

 russia.7t:0 "Звонок Трамп-Путин"
 russia.7d:0 "Недавно состоялся звонок формата Трамп-Путин, что сулит облегчение мировой общественности"
 russia.7a:0 "Приятно слышать"
 
 russia.8t:0 "Приглашение в ОВЗ"
 russia.8d:0 "Россия по Сахалинскому договору пригласила нас в свою сферу: Организация Взаимной Помощи"
 russia.8a:0 "У нас нет выбора"

 russia.9t:0 "Резиденция Романовых"
 russia.9d:0 "Мы наконец сможем пригласить династию Романовых на их историческую родину!"
 russia.9a:0 "Построить!"

 russia.10t:0 "Автономия для Казахстана?"
 russia.10d:0 "В отличии от малых стран нешей сферы Казахстан вряд ли приклонит голову перед нами просто так"
 russia.10a:0 "Автономия говоришь?"
 russia.10b:0 "Предложим им весь Туркестан! В нашем составе)"

 russia.11t:0 "Кавказ"
 russia.11d:0 "Что делать с Кавказом?"
 russia.11a:0 "Предложите им автономию"
 russia.11b:0 "Война - проще всего"

 russia.12t:0 "Предложение от РФ"
 russia.12d:0 "Россия предлагает нам войти в их состав как автономия."
 russia.12a:0 "Война того не стоит"
 russia.12b:0 "Нет"

 russia.13t:0 "Аляска"
 russia.13d:0 "Мы сформировали соглашение по купле-продаже Аляски"
 russia.13a:0 "Отправить!"

 russia.14t:0 "Беларусь"
 russia.14d:0 "Что делать с Беларусью?"
 russia.14a:0 "Автономия - как выход!"
 russia.14b:0 "К бою!"

 russia.15t:0 "Прибалтика"
 russia.15d:0 "Что делаем с Прибалтикой?"
 russia.15a:0 "Автономия?"

 russia.16t:0 "Славия?"
 russia.16d:0 "РФ предложили нам создать конфедерацию Славянских народов!"
 russia.16a:0 "Конечно!"
 russia.16b:0 "Абсурд и утопия!"

 russia.17t:0 "Выборы - предварительные результаты"
 russia.17d:0 "Нам удалось проанализировать ситуацию и выяснить приблизительного победителя на выборах"
 russia.17a:0 "Победит же сильнейший!"

 russia.18t:0 "Победители выборов"
 russia.18d:0 "Нам удалось узнать победителей выборов, и это..."
 russia.18a:0 "Единая Россия и Путин!"
 russia.18b:0 "Общество.Будущее и Юнеман!"

 russia.19t:0 "Победители выборов"
 russia.19d:0 "Нам удалось узнать победителей выборов, и это..."
 russia.19a:0 "ЛДПР и Слуцкий!"
 russia.19b:0 "КПРФ и Харитонов!"
 russia.19c:0 "КПРФ и Зюганов!"

