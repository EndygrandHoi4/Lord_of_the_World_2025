l_russian:
 LOADING_TIP_0: "«Мы построим стену, и Мексика заплатит за неё!».\n- Дональд Трамп"
 LOADING_TIP_2: "«Кто не жалеет о распаде СССР, у того нет сердца. Кто хочет воссоздать его – у того нет головы.».\n- Вячеслав Костиков"
 LOADING_TIP_3: "«Свобода означает ответственность. Вот почему многие её боятся.».\n- Ангела Меркель"
 LOADING_TIP_4: "«Европа должна быть сильной и суверенной.».\n- Эммануэль Макрон"
 LOADING_TIP_5: "«Я нужен вам не для того, чтобы вы меня любили. Я нужен вам для того, чтобы вы любили свою страну.».\n- Володимир Зеленський"
 LOADING_TIP_6: "«Get Brexit done!».\n- Борис Джонсон"
 LOADING_TIP_7: "«Мы можем делать великие вещи».\n- Джо Байден"
 LOADING_TIP_8: "«Коррупция – это рак, разъедающий тело партии.».\n- Си Цзиньпин"
 LOADING_TIP_9: "«Россия будет либо суверенной, либо её не будет вообще.».\n- Владимир Путин"
 LOADING_TIP_10: "«Мы как мученики попадём в рай, а они просто сдохнут.».\n- Владимир Путин"
 LOADING_TIP_11: "«Смерть одного человека — трагедия, смерть миллионов — статистика.».\n- Эрих Мария Ремарк"
 LOADING_TIP_12: "«Я​ ​—​ ​н​а​д​е​ж​д​а​ ​н​а​ц​и​и​.».\n- К​и​м​ ​Ч​е​н​ ​Ы​н​"
 LOADING_TIP_13: "«Д​е​м​о​к​р​а​т​и​я​ ​—​ ​э​т​о​ ​х​р​у​п​к​и​й​ ​д​а​р​.​ ​О​н​а​ ​т​р​е​б​у​е​т​ ​е​ж​е​д​н​е​в​н​о​й​ ​з​а​щ​и​т​ы​,​ ​п​о​т​о​м​у​ ​ч​т​о​ ​л​ю​б​о​й​ ​д​е​н​ь​ ​м​о​ж​е​т​ ​с​т​а​т​ь​ ​п​о​с​л​е​д​н​и​м​,​ ​к​о​г​д​а​ ​м​ы​ ​п​о​в​е​р​н​е​м​с​я​ ​к​ ​т​и​р​а​н​и​и​.».\n- Д​ж​о​ ​Б​а​й​д​е​н"
 LOADING_TIP_14: "«人类命运共同体».\n- Си Цзиньпин"
 LOADING_TIP_15: "«"​К​р​и​з​и​с​ы​ ​—​ ​э​т​о​ ​п​р​о​в​е​р​к​а​ ​н​а​ ​с​п​л​о​ч​е​н​н​о​с​т​ь​.​ ​Е​в​р​о​п​а​ ​д​о​л​ж​н​а​ ​о​с​т​а​в​а​т​ь​с​я​ ​е​д​и​н​о​й​,​ ​д​а​ж​е​ ​е​с​л​и​ ​к​а​ж​д​ы​й​ ​и​м​е​е​т​ ​с​в​о​и​ ​и​н​т​е​р​е​с​ы​.».\n- А​н​г​е​л​а​ ​М​е​р​к​е​л​ь"
 LOADING_TIP_16: "«Я нахожу вдохновение в самых разных вещах — в людях, которых встречаю, в книгах, которые читаю, и в собственных эмоциях».\n- Б​и​л​л​и​ ​А​й​л​и​"
 LOADING_TIP_17: "«Лучший совет, который мне давали, таков: сомневайтесь в себе и всегда думайте о том, как бы вы могли работать лучше».\n- Илон Маск"
